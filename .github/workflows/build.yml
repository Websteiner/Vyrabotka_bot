name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyTelegramBotAPI openpyxl requests python-dotenv
    - name: Build EXE
      run: pyinstaller --onefile --noconsole --name VyrabotkaBot pc_parser_bot.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VyrabotkaBot-EXE
        path: dist/VyrabotkaBot.exe
